# Builds and tests every pull request, push to main and version tag; images go to GHCR as
# ghcr.io/jfisbein/welcome-home:
#   pull request:    the image is built, which checks the Dockerfile, but not pushed;
#   push to main:    edge;
#   tag vX.Y.Z:      vX.Y.Z, vX and latest. A prerelease, such as v1.3.0-rc.1, gets only its own tag.
# A version tag also becomes a GitHub release once its image is out, with the release pull request's description
# as its notes.
name: Image

# What only changes documentation runs nothing: neither the tests nor the image read it, so edge would come out the
# same. Tags are not filtered by path, so a version tag always runs.
on:
  pull_request:
    paths-ignore: ["docs/**", "**.md", "LICENSE", ".claude/**"]
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["docs/**", "**.md", "LICENSE", ".claude/**"]
  workflow_dispatch:

# What every job may do unless it says otherwise: read the repository. Publishing is the image job's alone.
permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  # A newer commit on a pull request makes the older run pointless; publishing runs always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Everything that runs code from elsewhere, with a token that can only read: Gradle's plugins, the app's and the
  # tests' dependencies, the browser. What it hands on is the jar it built and tested.
  build:
    runs-on: ubuntu-latest
    # Four times what it takes: a run that hangs ends, with its log, rather than after GitHub's six hours.
    timeout-minutes: 20
    permissions:
      contents: read
      # To ask whether this commit's tests have already passed (below).
      actions: read
    steps:
      - uses: actions/checkout@v7

      # A version tag is put on a commit of main, which this workflow has just tested as a push to main: the same
      # commit is not tested a second time, only built. Any other tag is tested here like everything else.
      - id: tested
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/tested_on_main.sh

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # The browser is some 150 MB to download each time; its version is Playwright's, in build.gradle.kts.
      - if: steps.tested.outputs.already != 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('build.gradle.kts') }}

      - name: Install the browser for the JavaScript's tests
        if: steps.tested.outputs.already != 'true'
        run: ./gradlew installBrowser

      - name: Build and test
        if: steps.tested.outputs.already != 'true'
        # Two JVMs of tests, Gradle's share of the runner's four processors. Three took longer (2026-11-20: 238 s
        # against 214), as the databases and browsers they start need processors too.
        run: ./gradlew build

      - name: Build what was tested on main
        if: steps.tested.outputs.already == 'true'
        run: ./gradlew bootJar

      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: jar
          path: build/libs/welcome-home.jar
          if-no-files-found: error
          retention-days: 1

  # Production's own backup.sh and restore.sh, on a copy of its stack, with an image of this commit's jar. A job of
  # its own, beside build, as it takes over a minute and needs nothing of the tests; it builds the jar again, which
  # takes less than waiting for build's. Like build, not for a version tag whose commit passed on main.
  restore:
    runs-on: ubuntu-latest
    # It hung once with nothing to read (2026-11-20, cancelled after 15 minutes; the same commit passed when run
    # again): a step that ends by its timeout keeps its log, which one cancelled by hand did not.
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7

      - id: tested
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/tested_on_main.sh

      - if: steps.tested.outputs.already != 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - if: steps.tested.outputs.already != 'true'
        uses: gradle/actions/setup-gradle@v6

      - name: Try backing up and restoring
        if: steps.tested.outputs.already != 'true'
        run: |
          ./gradlew bootJar generateKeysets
          docker build --tag welcome-home:restore-test .
          .github/scripts/test_backup_restore.sh welcome-home:restore-test

  # Publishes the image, from the jar that build tested, and is the only job that may write packages: it runs no
  # build tool and no test, so nothing they bring ever holds the token that can replace the image production
  # pulls. Not for pull requests, whose Dockerfile the restore job has already built.
  image:
    needs: [build, restore]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: jar
          path: build/libs

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # A semver tag also gets latest, unless it is a prerelease.
          flavor: latest=auto
          # {{raw}} is the git tag as it is: with any other pattern a prerelease's tag would lose its "v".
          tags: |
            type=edge,branch=main
            type=semver,pattern={{raw}}
            type=semver,pattern=v{{major}},enable=${{ !contains(github.ref_name, '-') }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The GitHub release of a version tag. Its notes are the description of the merged release pull request (branch
  # release-X.Y.Z) without what is about the pull request itself (.github/scripts/release_notes.py), or GitHub's
  # generated notes when there is none. A prerelease tag makes a prerelease; a release that exists is left alone.
  release:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "The release $TAG already exists"
            exit 0
          fi
          version="${TAG#v}"
          flags=(--verify-tag --title "welcome-home $version")
          if [[ "$TAG" == *-* ]]; then
            flags+=(--prerelease)
          else
            flags+=(--latest)
          fi
          description=$(gh pr list --state merged --head "release-$version" --json body --jq '.[0].body // ""')
          if [ -n "$description" ]; then
            printf '%s\n' "$description" | python3 .github/scripts/release_notes.py > notes.md
            gh release create "$TAG" "${flags[@]}" --notes-file notes.md
          else
            gh release create "$TAG" "${flags[@]}" --generate-notes
          fi
