# Builds and tests every pull request, push to main and version tag; images go to GHCR as
# ghcr.io/jfisbein/welcome-home:
#   pull request:    the image is built, which checks the Dockerfile, but not pushed;
#   push to main:    edge;
#   tag vX.Y.Z:      vX.Y.Z, vX and latest. A prerelease, such as v1.3.0-rc.1, gets only its own tag.
name: Image

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  # A newer commit on a pull request makes the older run pointless; publishing runs always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build

      - uses: docker/setup-buildx-action@v3

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # A semver tag also gets latest, unless it is a prerelease.
          flavor: latest=auto
          # {{raw}} is the git tag as it is: with any other pattern a prerelease's tag would lose its "v".
          tags: |
            type=edge,branch=main
            type=semver,pattern={{raw}}
            type=semver,pattern=v{{major}},enable=${{ !contains(github.ref_name, '-') }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
