# Builds and tests every pull request, push to main and version tag; images go to GHCR as
# ghcr.io/jfisbein/welcome-home:
#   pull request:    the image is built, which checks the Dockerfile, but not pushed;
#   push to main:    edge;
#   tag vX.Y.Z:      vX.Y.Z, vX and latest. A prerelease, such as v1.3.0-rc.1, gets only its own tag.
# A version tag also becomes a GitHub release once its image is out, with the release pull request's description
# as its notes.
name: Image

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  # A newer commit on a pull request makes the older run pointless; publishing runs always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build

      - uses: docker/setup-buildx-action@v4

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # A semver tag also gets latest, unless it is a prerelease.
          flavor: latest=auto
          # {{raw}} is the git tag as it is: with any other pattern a prerelease's tag would lose its "v".
          tags: |
            type=edge,branch=main
            type=semver,pattern={{raw}}
            type=semver,pattern=v{{major}},enable=${{ !contains(github.ref_name, '-') }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The GitHub release of a version tag. Its notes are the description of the merged release pull request (branch
  # release-X.Y.Z) without what is about the pull request itself (.github/scripts/release_notes.py), or GitHub's
  # generated notes when there is none. A prerelease tag makes a prerelease; a release that exists is left alone.
  release:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "The release $TAG already exists"
            exit 0
          fi
          version="${TAG#v}"
          flags=(--verify-tag --title "welcome-home $version")
          if [[ "$TAG" == *-* ]]; then
            flags+=(--prerelease)
          else
            flags+=(--latest)
          fi
          description=$(gh pr list --state merged --head "release-$version" --json body --jq '.[0].body // ""')
          if [ -n "$description" ]; then
            printf '%s\n' "$description" | python3 .github/scripts/release_notes.py > notes.md
            gh release create "$TAG" "${flags[@]}" --notes-file notes.md
          else
            gh release create "$TAG" "${flags[@]}" --generate-notes
          fi
