# Weekly version updates; each pull request runs the Image workflow (build, tests, image build).
# Gradle dependencies come one pull request each; for Actions and Compose, minor and patch updates come
# grouped, and major ones one by one.
version: 2

updates:
  # One pull request per dependency.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Madrid
    ignore:
      # Must stay the version of the webauthn4j-core that Spring Security brings (see build.gradle.kts).
      - dependency-name: com.webauthn4j:webauthn4j-test

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Madrid
    groups:
      github-actions:
        update-types: [minor, patch]

  # The Dockerfile's JDK and JRE images.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Madrid
    ignore:
      # A new Java version is a decision of its own, together with the toolchain in build.gradle.kts.
      - dependency-name: eclipse-temurin
        update-types: [version-update:semver-major]

  # Postgres for development and in production. Production's cloudflared runs as latest, which Dependabot does
  # not track.
  - package-ecosystem: docker-compose
    directories: [/, /deploy]
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Madrid
    groups:
      docker-compose:
        update-types: [minor, patch]
    ignore:
      # A new major Postgres needs a dump and restore of the data, not just a new image.
      - dependency-name: postgres
        update-types: [version-update:semver-major]
      # Our own image: production follows its major version's tag (:v1).
      - dependency-name: ghcr.io/jfisbein/welcome-home
