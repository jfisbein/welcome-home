# Production stack for Dockge: copy this directory to the stack's folder and create ./secrets and ./backups
# first (see "Production" in the README). No port is published: the Cloudflare tunnel is the only way in.
name: welcome-home

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: welcome_home
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      MIGRATOR_PASSWORD_FILE: /run/secrets/migrator_password
      APP_USER_PASSWORD_FILE: /run/secrets/app_user_password
    secrets:
      - postgres_password
      - migrator_password
      - app_user_password
    volumes:
      - ./db-init:/docker-entrypoint-initdb.d:ro
      # Since Postgres 18 the image keeps its data in /var/lib/postgresql/<major>/docker.
      - db-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d welcome_home"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    # The latest release of major version 2, so that Dockge's Update upgrades it: releases within a major are
    # backward compatible (AGENTS.md, Conventions). The running release is the image's
    # org.opencontainers.image.version label. To roll back, pin the previous one, such as v2.0.0.
    image: ghcr.io/jfisbein/welcome-home:v2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Your public URL: this one is an example.
      BASE_URL: https://welcome-home.example.com
      TZ: Europe/Madrid
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/welcome_home
      SPRING_DATASOURCE_USERNAME: app_user
      SPRING_LIQUIBASE_USER: migrator
      # Each file in this directory is the property its name says: the database and SMTP passwords, and Nuki's
      # OAuth2 client.
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/config/
      AEAD_KEYSET_FILE: /run/secrets/aead_keyset
      MAC_KEYSET_FILE: /run/secrets/mac_keyset
      # Owners' emails, through SMTP2GO with STARTTLS; the sender must be verified there.
      SPRING_MAIL_HOST: mail.smtp2go.com
      SPRING_MAIL_PORT: "2525"
      # An example: your own sender, on a domain verified in SMTP2GO.
      NOTIFICATIONS_FROM: "welcome-home <avisos@example.com>"
    secrets:
      - source: app_user_password
        target: /run/secrets/config/spring.datasource.password
      - source: migrator_password
        target: /run/secrets/config/spring.liquibase.password
      - source: smtp_username
        target: /run/secrets/config/spring.mail.username
      - source: smtp_password
        target: /run/secrets/config/spring.mail.password
      # welcome-home's OAuth2 client, from Nuki Web's API page once Nuki grants the Advanced API. Without them
      # (remove these two and their entries below), owners connect Nuki only by pasting an API token.
      - source: nuki_oauth_client_id
        target: /run/secrets/config/welcomehome.nuki.oauth.client-id
      - source: nuki_oauth_client_secret
        target: /run/secrets/config/welcomehome.nuki.oauth.client-secret
      - aead_keyset
      - mac_keyset
    networks:
      - backend
      - frontend
    # The JVM sizes its heap to 75% of this (MaxRAMPercentage in the Dockerfile), not of the whole LXC. Measured
    # on v1.5.0: about 300 MiB after starting and 400 MiB after 12,000 requests, with 40 MB of live heap.
    mem_limit: 1g
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # The image has no curl or wget.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  backup:
    image: postgres:18
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # The postgres user, which owns ./backups on the host.
    user: "999:999"
    entrypoint: ["/backup/backup.sh"]
    environment:
      TZ: Europe/Madrid
      # After the access events' purge at 03:30.
      BACKUP_TIME: "04:00"
      BACKUP_RETENTION_DAYS: "30"
      PGHOST: db
      PGDATABASE: welcome_home
      # The superuser, as Row-Level Security would hide every row from any other role.
      PGUSER: postgres
      PGPASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - ./backup:/backup:ro
      - ./backups:/backups
    networks:
      - backend
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Unhealthy when the last dump is more than 25 hours old.
      test: ["CMD-SHELL", "find /backups -name 'welcome_home-*.dump' -mmin -1500 | grep -q ."]
      interval: 1h
      start_period: 5m
      start_interval: 10s

  cloudflared:
    # Cloudflare supports cloudflared releases up to a year old. Pin one, such as 2026.10.0, if an update breaks
    # the tunnel.
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/tunnel_token
    secrets:
      - tunnel_token
    depends_on:
      app:
        condition: service_healthy
    networks:
      - frontend
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  # The database has no way out; the app reaches Nuki and the tunnel reaches the app through frontend.
  backend:
    internal: true
  frontend: {}

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  migrator_password:
    file: ./secrets/migrator_password
  app_user_password:
    file: ./secrets/app_user_password
  aead_keyset:
    file: ./secrets/aead-keyset.json
  mac_keyset:
    file: ./secrets/mac-keyset.json
  tunnel_token:
    file: ./secrets/tunnel_token
  smtp_username:
    file: ./secrets/smtp_username
  smtp_password:
    file: ./secrets/smtp_password
  nuki_oauth_client_id:
    file: ./secrets/nuki-oauth-client-id
  nuki_oauth_client_secret:
    file: ./secrets/nuki-oauth-client-secret

volumes:
  db-data:
