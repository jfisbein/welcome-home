# Development only: Postgres for ./gradlew bootRun. Production: deploy/compose.yaml.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: welcome_home
      POSTGRES_USER: postgres
      # As production: text compared by PostgreSQL's own rules. Only for a new volume (docker compose down -v).
      POSTGRES_INITDB_ARGS: --locale-provider=builtin --builtin-locale=C.UTF-8
      POSTGRES_PASSWORD: postgres
      MIGRATOR_PASSWORD: migrator
      APP_USER_PASSWORD: app_user
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./deploy/db-init:/docker-entrypoint-initdb.d:ro
      - db-data:/var/lib/postgresql

volumes:
  db-data:
