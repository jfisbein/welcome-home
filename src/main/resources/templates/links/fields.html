<!DOCTYPE html>
<html lang="es" th:lang="${#locale.language}" th:attr="data-theme=${theme}" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- The link form's fields, shared by creating and editing a link. Reads label, validFrom, validUntil, scheduleDays and their errors. -->
<th:block th:fragment="fields(timeZone)">
    <label>
        [[#{link-form.label}]]
        <input type="text" name="label" maxlength="100" required th:value="${label}"
               th:attr="aria-invalid=${labelError} ? 'true' : null"
               th:placeholder="#{link-form.label.placeholder}">
        <small th:if="${labelError}" th:text="#{link-form.label.error}">Escribe para quién es el enlace.</small>
    </label>
    <div class="grid">
        <label>
            [[#{link-form.from}]]
            <input type="datetime-local" name="validFrom" required th:value="${validFrom}"
                   th:attr="aria-invalid=${validFromError} ? 'true' : null">
            <small th:if="${validFromError}" th:text="#{link-form.from.error}">Indica la fecha y hora de inicio.</small>
        </label>
        <label>
            [[#{link-form.until}]]
            <input type="datetime-local" name="validUntil" required th:value="${validUntil}"
                   th:attr="aria-invalid=${validUntilError} ? 'true' : null">
            <small th:if="${validUntilError == 'invalid'}" th:text="#{link-form.until.error.invalid}">
                Indica la fecha y hora de fin.</small>
            <small th:if="${validUntilError == 'before-start'}" th:text="#{link-form.until.error.before-start}">
                El fin tiene que ser posterior al inicio.</small>
            <small th:if="${validUntilError == 'past'}" th:text="#{link-form.until.error.past}">El fin ya ha pasado.</small>
        </label>
    </div>
    <!-- The PIN a guest types after the slide, if any. A password field with an eye (reveal.js) to read it: the owner
         can see it again whenever they edit the link. -->
    <label for="link-pin" th:text="#{link-form.pin}">PIN (opcional)</label>
    <fieldset role="group" class="reveal">
        <input id="link-pin" type="password" name="pin" inputmode="numeric" autocomplete="off"
               th:pattern="|[0-9]{${pinMinLength},${pinMaxLength}}|" th:maxlength="${pinMaxLength}" th:value="${pin}"
               aria-describedby="link-pin-hint"
               th:attr="aria-invalid=${pinError} ? 'true' : null">
        <button type="button" class="secondary" hidden data-reveal="link-pin" aria-pressed="false"
                th:data-show="#{link-form.pin.show}" th:data-hide="#{link-form.pin.hide}"
                th:aria-label="#{link-form.pin.show}">
            <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" hidden>
                <path d="M17.94 17.94A10.9 10.9 0 0 1 12 19c-7 0-11-7-11-7a19.8 19.8 0 0 1 5.06-5.94M9.9 4.24A10.9 10.9 0 0 1 12 5c7 0 11 7 11 7a19.9 19.9 0 0 1-3.17 4.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                <path d="M1 1l22 22"/></svg>
        </button>
    </fieldset>
    <small id="link-pin-hint" th:text="${pinError} ? #{link-form.pin.error(${pinMinLength}, ${pinMaxLength})} : #{link-form.pin.hint(${pinMinLength}, ${pinMaxLength})}">
        Si pones un PIN, quien abra el enlace tendrá que escribirlo después de deslizar.</small>
    <!-- A row per day, no JavaScript needed: CSS hides the hours of a whole day. schedule.js keeps a row's two ticks
         in step and offers to copy one day's hours to the rest. -->
    <details class="schedule" th:open="${scheduleOpen or scheduleNeverOpens}">
        <summary th:text="#{link-form.schedule}">Limitar a ciertos días y horas</summary>
        <p><small th:text="#{link-form.schedule.hint}">Si no marcas ningún día, abre a cualquier hora.</small></p>
        <div class="schedule-day" th:each="day : ${scheduleDays}"
             th:with="dayName=${day.name(#locale)}, code=${day.day().name()}">
            <label>
                <input type="checkbox" th:name="|day-${code}|" th:checked="${day.selected()}">
                [[${dayName}]]
            </label>
            <label class="schedule-all-day">
                <input type="checkbox" th:name="|allday-${code}|" th:checked="${day.allDay()}"
                       th:aria-label="#{link-form.schedule.all-day-of(${dayName})}">
                [[#{link-form.schedule.all-day}]]
            </label>
            <input type="time" th:name="|opens-${code}|" th:value="${day.opens()}"
                   th:aria-label="#{link-form.schedule.opens(${dayName})}"
                   th:attr="aria-invalid=${day.invalid()} ? 'true' : null">
            <input type="time" th:name="|closes-${code}|" th:value="${day.closes()}"
                   th:aria-label="#{link-form.schedule.closes(${dayName})}"
                   th:attr="aria-invalid=${day.invalid()} ? 'true' : null">
            <small th:if="${day.invalid()}" th:text="#{link-form.schedule.error}">Indica las horas.</small>
        </div>
        <p th:if="${scheduleNeverOpens}" role="alert"><small th:text="#{link-form.schedule.never-opens}">
            Con este horario, el enlace no abriría nunca dentro de sus fechas.</small></p>
        <button type="button" class="outline secondary" hidden data-copy-schedule
                th:text="#{link-form.schedule.copy}">Usar el primer horario en todos</button>
    </details>
    <p><small th:text="#{link-form.time-zone(${@timeZoneNames.of(timeZone, #locale)})}">Horas en la zona horaria de la cerradura.</small></p>
</th:block>
</body>
</html>
