<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- A table of a lock's links: those that can still open, or those that ended. A row leads to its link's page,
     where everything else is done with it; the row itself only sends the link. -->
<div class="overflow-auto" th:fragment="linkTable(rows)">
    <table class="links">
        <thead>
        <tr>
            <th scope="col" th:text="#{links.column.for}">Para</th>
            <th scope="col" th:text="#{links.column.validity}">Validez</th>
            <th scope="col" th:text="#{links.column.state}">Estado</th>
            <th scope="col"></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="link : ${rows}">
            <td class="label"><a th:href="@{/links/{id}(id=${link.id})}" th:text="${link.label}">Ana</a></td>
            <td class="validity"><th:block th:replace="~{links/table :: validity(${link})}"></th:block></td>
            <td class="state"><th:block th:replace="~{links/table :: state(${link})}"></th:block></td>
            <td class="buttons">
                <div class="actions" th:if="${link.status.usable}">
                    <th:block th:replace="~{links/table :: send(${link}, ${lock}, true)}"></th:block>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
</div>
<!-- When a link opens and what it asks for, in its row and on its page. -->
<th:block th:fragment="validity(link)">
    <span th:text="#{links.period(${#temporals.format(link.validFrom, #messages.msg('format.datetime'))}, ${#temporals.format(link.validUntil, #messages.msg('format.datetime'))})}">
        1/11/2030 15:00 – 3/11/2030 11:00</span>
    <small th:each="line : ${link.schedule}" th:text="${line}">Lunes a viernes: 09:00–17:00</small>
    <small th:if="${link.hasPin}" th:text="#{links.pin-set}">Pide un PIN</small>
    <small th:if="${link.pinLocked}"><strong th:text="#{links.pin-locked}">Bloqueado por PIN
        incorrectos</strong></small>
    <!-- Whether the guest got in, without opening the link's history. -->
    <small th:if="${link.lastOpened}"
           th:text="#{links.last-opened(${#temporals.format(link.lastOpened, #messages.msg('format.datetime'))})}">
        Última apertura: 2/11/2030 19:23</small>
    <small th:unless="${link.lastOpened}" th:text="#{links.never-opened}">Todavía no ha abierto la
        puerta</small>
</th:block>
<th:block th:fragment="state(link)" th:switch="${link.status.name()}">
    <span th:case="'PENDING'" th:text="#{links.status.pending}">Pendiente</span>
    <span th:case="'ACTIVE'"><strong th:text="#{links.status.active}">Activo</strong></span>
    <span th:case="'EXPIRED'" th:text="#{links.status.expired}">Caducado</span>
    <span th:case="'REVOKED'" th:text="#{links.status.revoked}">Anulado</span>
    <span th:case="'PAUSED'"><strong th:text="#{links.status.paused}">En pausa</strong></span>
</th:block>
<!-- The buttons that copy or share a link. Its guest gets words with it, not a bare link: when it opens, to open it
     in front of the door and not to try it before, and that a PIN follows if it asks for one (copy.js, share.js). -->
<th:block th:fragment="send(link, lock, outline)">
    <th:block th:with="words=#{links.share-text(${lock.name}, ${#temporals.format(link.validFrom, #messages.msg('format.datetime'))}, ${#temporals.format(link.validUntil, #messages.msg('format.datetime'))}, ${@timeZoneNames.of(lock.timeZone, #locale)})} + (${link.hasPin} ? ' ' + #{links.share-pin} : '')">
        <button type="button" th:classappend="${outline} ? 'outline'" th:data-copy-text="${words}"
                th:data-copy-url="${link.url}" th:data-copied="#{common.copied}" th:data-copy-failed="#{common.copy-failed}"
                th:text="#{common.copy}">Copiar</button>
        <button type="button" class="secondary" th:classappend="${outline} ? 'outline'" hidden
                th:data-share-text="${words}" th:data-share-url="${link.url}"
                th:data-share-title="#{links.share-title(${lock.name})}"
                th:text="#{common.share}">Compartir</button>
    </th:block>
</th:block>
</body>
</html>
