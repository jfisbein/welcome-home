<!DOCTYPE html>
<html lang="es" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{link-edit.title})}"></head>
<body>
<main class="container">
    <nav th:replace="~{fragments/layout :: nav}"></nav>
    <h1 th:text="#{link-edit.heading(${link.label})}">Enlace de Ana</h1>
    <p th:text="#{link-edit.text(${link.lockName})}">Abre Casa. Si cambias las fechas o la etiqueta, la URL sigue.</p>

    <form th:action="@{/links/{id}(id=${link.id})}" th:method="patch">
        <th:block th:replace="~{links/fields :: fields(${link.timeZone})}"></th:block>
        <button type="submit" th:text="#{common.save}">Guardar</button>
    </form>
    <p><a th:href="@{/locks/{id}/links(id=${link.lockId})}" th:text="#{link-edit.back(${link.lockName})}">
        Volver a los enlaces de Casa</a></p>
</main>
</body>
</html>
