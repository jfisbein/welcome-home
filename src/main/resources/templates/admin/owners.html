<!DOCTYPE html>
<html lang="es" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{admin.owners.title})}"></head>
<body>
<main class="container">
    <nav th:replace="~{fragments/layout :: menu('admin')}"></nav>
    <h1 th:text="#{admin.owners.title}">Propietarios</h1>

    <article th:if="${recovery}">
        <header><strong th:text="#{admin.recovery.created}">Enlace de nueva passkey creado</strong></header>
        <p th:utext="#{admin.recovery.text(${#strings.escapeXml(recoveredEmail)})}">
            Envía este enlace a <strong>ana@example.com</strong> para que cree una passkey nueva.
        </p>
        <fieldset role="group">
            <input id="recovery-url" type="text" readonly th:value="${recovery.url}"
                   th:aria-label="#{admin.recovery.url}">
            <button type="button" data-copy="recovery-url" th:data-copied="#{common.copied}"
                    th:text="#{common.copy}">Copiar</button>
        </fieldset>
    </article>

    <article th:if="${deletedEmail}">
        <p th:text="#{admin.deleted(${deletedEmail})}">Cuenta de ana@example.com dada de baja.</p>
    </article>

    <p><a th:href="@{/admin/invitations}" role="button" th:text="#{admin.invite}">Invitar a un propietario</a></p>
    <table>
        <thead>
        <tr>
            <th scope="col" th:text="#{admin.column.email}">Email</th>
            <th scope="col" th:text="#{admin.column.registered}">Alta</th>
            <th scope="col"></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="owner : ${owners}">
            <td th:text="${owner.email}">propietario@example.com</td>
            <td th:text="${#temporals.format(owner.registeredOn, #messages.msg('format.date'))}">1/1/2026</td>
            <td class="actions">
                <form th:action="@{/admin/recoveries}" method="post">
                    <input type="hidden" name="email" th:value="${owner.email}">
                    <button type="submit" class="outline secondary" th:title="#{admin.recovery.title}"
                            th:text="#{admin.recovery}">Nueva passkey</button>
                </form>
                <form th:unless="${owner.email == adminEmail}" th:action="@{/admin/owners}" th:method="delete"
                      th:data-confirm="#{admin.delete.confirm(${owner.email})}">
                    <input type="hidden" name="email" th:value="${owner.email}">
                    <button type="submit" class="outline contrast" th:text="#{admin.delete}">Dar de baja</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
<script th:src="@{/js/copy.js}"></script>
<script th:src="@{/js/confirm.js}"></script>
</body>
</html>
