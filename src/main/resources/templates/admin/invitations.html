<!DOCTYPE html>
<html lang="es" th:lang="${#locale.language}" th:attr="data-theme=${theme}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{admin.invitations.title})}"></head>
<body>
<main class="container">
    <nav th:replace="~{fragments/layout :: menu('admin')}"></nav>
    <h1 th:text="#{admin.invite}">Invitar a un propietario</h1>

    <article th:if="${invitation}">
        <header><strong th:text="#{admin.invitation.created}">Invitación creada</strong></header>
        <p th:utext="#{admin.invitation.text(${#strings.escapeXml(invitedNote)})}">
            Envía este enlace a <strong>Ana</strong>. Sirve una sola vez y caduca en 72 horas.
        </p>
        <fieldset role="group">
            <input id="invitation-url" type="text" readonly th:value="${invitation.url}"
                   th:aria-label="#{admin.invitation.url}">
            <button type="button" data-copy="invitation-url" th:data-copied="#{common.copied}"
                    th:text="#{common.copy}">Copiar</button>
        </fieldset>
    </article>

    <form th:action="@{/admin/invitations}" method="post">
        <label>
            [[#{admin.invitation.note}]]
            <input type="text" name="note" maxlength="100" required th:value="${note}"
                   th:attr="aria-invalid=${noteError} ? 'true' : null"
                   th:placeholder="#{admin.invitation.note.placeholder}">
            <small th:if="${noteError}" th:text="#{admin.invitation.note.error}">Escribe para quién es.</small>
        </label>
        <label>
            <input type="checkbox" name="grantsAdmin" value="true">
            [[#{admin.invitation.grants-admin}]]
        </label>
        <button type="submit" th:text="#{admin.invitation.create}">Crear invitación</button>
    </form>
    <p><a th:href="@{/admin/owners}" th:text="#{admin.back}">Volver a propietarios</a></p>
</main>
<script th:src="@{/js/copy.js}"></script>
</body>
</html>
