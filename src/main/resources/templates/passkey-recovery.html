<!DOCTYPE html>
<html lang="es" th:lang="${#locale.language}" th:attr="data-theme=${theme}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{recovery.title})}"></head>
<body>
<main class="container">
    <article>
        <header><h1 th:text="#{recovery.title}">Nueva passkey</h1></header>
        <p th:utext="#{recovery.text(${#strings.escapeXml(email)})}">
            Crea una passkey en este dispositivo para entrar como <strong>ana@example.com</strong>.
        </p>
        <form id="registration">
            <button type="submit" th:text="#{invitation.create}">Crear passkey</button>
        </form>
        <p id="registration-error" role="alert" hidden></p>
        <div th:replace="~{invitation :: messages}"></div>
    </article>
</main>
<script th:src="@{/js/webauthn.js}"></script>
<script th:src="@{/js/invitation.js}"></script>
</body>
</html>
