<!DOCTYPE html>
<html lang="es" th:lang="${#locale.language}" th:attr="data-theme=${theme}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{login.title})}"></head>
<body>
<main class="container">
    <article>
        <header><h1>welcome-home</h1></header>
        <p th:if="${param.logout}" th:text="#{login.signed-out}">Has cerrado la sesión.</p>
        <p th:text="#{login.text}">Entra con la passkey de tu dispositivo.</p>
        <button id="passkey-login" type="button" th:text="#{login.button}">Entrar con passkey</button>
        <p id="login-error" role="alert" hidden th:text="#{login.error}">No se ha podido entrar con la passkey.</p>
    </article>
</main>
<script th:src="@{/js/webauthn.js}"></script>
<script th:src="@{/js/login.js}"></script>
</body>
</html>
