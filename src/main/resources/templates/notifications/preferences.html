<!DOCTYPE html>
<html lang="es" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{notifications.title})}"></head>
<body>
<main class="container">
    <nav th:replace="~{fragments/layout :: menu('settings')}"></nav>
    <nav th:replace="~{fragments/layout :: settings('notifications')}"></nav>
    <h1 th:text="#{notifications.heading}">Avisos por email</h1>

    <article th:unless="${emailConfigured}" role="alert">
        <p th:text="#{notifications.not-configured}">El envío de emails no está configurado en el servidor.</p>
    </article>
    <article th:unless="${emailVerified}" role="alert">
        <p th:text="#{notifications.unverified}">Tu email no está confirmado.</p>
    </article>
    <article th:if="${testUnverified}" role="alert">
        <p th:text="#{notifications.unverified}">Tu email no está confirmado.</p>
    </article>
    <article th:if="${saved}"><p th:text="#{notifications.saved}">Guardado.</p></article>
    <article th:if="${testSent}">
        <p th:text="#{notifications.test-sent(${email})}">Email de prueba enviado.</p>
    </article>
    <article th:if="${testFailed}" role="alert">
        <p th:text="#{notifications.test-failed}">No se ha podido enviar el email de prueba.</p>
    </article>

    <p th:text="#{notifications.sent-to(${email})}">Te los enviamos a ana@example.com.</p>
    <form th:action="@{/notifications}" th:method="put">
        <fieldset>
            <legend th:text="#{notifications.when}">Avísame cuando…</legend>
            <label>
                <input type="checkbox" name="opened" value="true" th:checked="${preferences.opened}">
                [[#{notifications.opened}]]
            </label>
            <label>
                <input type="checkbox" name="failed" value="true" th:checked="${preferences.failed}">
                [[#{notifications.failed}]]
            </label>
            <label>
                <input type="checkbox" name="denied" value="true" th:checked="${preferences.denied}">
                [[#{notifications.denied}]]
            </label>
            <label>
                <input type="checkbox" name="disconnected" value="true" th:checked="${preferences.disconnected}">
                [[#{notifications.disconnected}]]
            </label>
        </fieldset>
        <button type="submit" th:text="#{common.save}">Guardar</button>
    </form>

    <form th:if="${emailConfigured and emailVerified}" th:action="@{/notifications/test}" method="post">
        <button type="submit" class="secondary" th:text="#{notifications.test}">Enviarme un email de prueba</button>
    </form>
</main>
</body>
</html>
