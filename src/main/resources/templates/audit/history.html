<!DOCTYPE html>
<html lang="es" th:lang="${#locale.language}" th:attr="data-theme=${theme}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{history.title(${lock.name})})}"></head>
<body>
<main class="container">
    <nav th:replace="~{fragments/layout :: menu('locks')}"></nav>
    <h1 th:text="#{history.title(${lock.name})}">Historial de Casa</h1>
    <p th:if="${filtered}">
        <span th:text="#{history.only-link(${linkLabel})}">Solo el enlace de Ana.</span>
        <a th:href="@{/locks/{id}/history(id=${lock.id})}" th:text="#{history.whole-lock}">Ver toda la cerradura</a>
    </p>
    <p th:text="#{history.time-zone(${lock.timeZone})}">Hora de Europe/Madrid.</p>

    <p th:if="${events.isEmpty()}" th:text="#{history.empty}">Todavía no hay intentos de abrir.</p>
    <th:block th:unless="${events.isEmpty()}">
        <div th:replace="~{fragments/attempts :: table(${events}, false)}"></div>
    </th:block>

    <p class="actions">
        <a th:if="${paged}" th:href="${newerUrl}" th:text="#{history.newer}">Más recientes</a>
        <a th:if="${olderUrl}" th:href="${olderUrl}" th:text="#{history.older}">Anteriores</a>
    </p>
    <p><a th:href="@{/locks/{id}(id=${lock.id})}" th:text="#{history.back(${lock.name})}">Volver a Casa</a></p>
</main>
</body>
</html>
