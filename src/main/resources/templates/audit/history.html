<!DOCTYPE html>
<html lang="es" th:lang="${#locale.language}" th:attr="data-theme=${theme}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{history.title(${lock.name})})}"></head>
<body>
<main id="main" tabindex="-1" class="container">
    <nav th:replace="~{fragments/layout :: menu('locks')}"></nav>
    <h1 th:text="#{history.title(${lock.name})}">Historial de Casa</h1>
    <p th:if="${filtered}">
        <span th:text="#{history.only-link(${linkLabel})}">Solo el enlace de Ana.</span>
        <a th:href="@{/locks/{id}/history(id=${lock.id})}" th:text="#{history.whole-lock}">Ver toda la cerradura</a>
    </p>
    <p th:text="#{history.time-zone(${@timeZoneNames.of(lock.timeZone, #locale)})}">Horas en la zona horaria de la cerradura: hora de Europa central.</p>

    <!-- Narrows the history: to what the attempts came to, and from a day back. A GET, so that the page it gives
         can be reloaded and sent. -->
    <form class="history-filter" th:action="@{/locks/{id}/history(id=${lock.id})}" method="get">
        <input th:if="${link != null}" type="hidden" name="link" th:value="${link}">
        <fieldset class="grid">
            <label>
                [[#{history.column.outcome}]]
                <select name="result">
                    <option value="" th:text="#{history.filter.all}">Todos</option>
                    <option value="OK" th:selected="${result != null and result.name() == 'OK'}"
                            th:text="#{history.filter.OK}">Aperturas</option>
                    <option value="ERROR" th:selected="${result != null and result.name() == 'ERROR'}"
                            th:text="#{history.filter.ERROR}">Fallos</option>
                    <option value="DENIED" th:selected="${result != null and result.name() == 'DENIED'}"
                            th:text="#{history.filter.DENIED}">Denegados</option>
                </select>
            </label>
            <label>
                [[#{history.filter.until}]]
                <input type="date" name="until" th:value="${until}">
            </label>
        </fieldset>
        <button type="submit" class="secondary" th:text="#{history.filter.apply}">Filtrar</button>
    </form>

    <p th:if="${events.isEmpty() and !narrowed}" th:text="#{history.empty}">Todavía no hay intentos de abrir.</p>
    <p th:if="${events.isEmpty() and narrowed}" th:text="#{history.empty-narrowed}">Ningún intento así.</p>
    <th:block th:unless="${events.isEmpty()}">
        <div th:replace="~{fragments/attempts :: table(${events}, false)}"></div>
    </th:block>

    <p class="actions">
        <a th:if="${paged}" th:href="${newerUrl}" th:text="#{history.newer}">Más recientes</a>
        <a th:if="${olderUrl}" th:href="${olderUrl}" th:text="#{history.older}">Anteriores</a>
    </p>
    <p><a th:href="@{/locks/{id}(id=${lock.id})}" th:text="#{history.back(${lock.name})}">Volver a Casa</a></p>
</main>
</body>
</html>
