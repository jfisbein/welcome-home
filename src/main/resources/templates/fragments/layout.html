<!DOCTYPE html>
<html lang="es" th:lang="${#locale.language}" th:attr="data-theme=${theme}" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow" th:if="${noindex}">
    <meta http-equiv="refresh" th:if="${refreshSeconds}" th:content="${refreshSeconds}">
    <meta name="_csrf" th:if="${_csrf != null and sessionless != true}" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:if="${_csrf != null and sessionless != true}" th:content="${_csrf.headerName}">
    <title th:text="${title} + ' · welcome-home'">welcome-home</title>
    <link rel="icon" th:href="@{/favicon.ico}" sizes="48x48">
    <link rel="icon" th:href="@{/favicon.svg}" type="image/svg+xml">
    <link rel="apple-touch-icon" th:href="@{/apple-touch-icon.png}">
    <link rel="stylesheet" th:href="@{/css/pico.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<!-- section: locks, settings or admin, the one the page belongs to; the home page is the list of locks. Not named "nav": a fragment
     selector also matches elements by name, and this file has two navs. -->
<nav th:fragment="menu(section)" class="menu">
    <a href="#main" class="skip-link" th:text="#{nav.skip}">Saltar al contenido</a>
    <ul><li><a th:href="@{/}"><strong>welcome-home</strong></a><small class="version" th:if="${appVersion}" th:text="${appVersion}">4.2.0</small></li></ul>
    <ul>
        <li><a th:href="@{/}" th:attr="aria-current=${section == 'locks'} ? 'page' : null"
               th:text="#{nav.locks}">Cerraduras</a></li>
        <li><a th:href="@{/settings}" th:attr="aria-current=${section == 'settings'} ? 'page' : null"
               th:text="#{nav.settings}">Configuración</a></li>
        <li th:if="${isAdmin}"><a th:href="@{/admin/owners}" th:attr="aria-current=${section == 'admin'} ? 'page' : null"
                                  th:text="#{nav.admin}">Administración</a></li>
        <li>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="secondary" th:text="#{nav.sign-out}">Salir</button>
            </form>
        </li>
    </ul>
</nav>
<!-- Configuration's sections, each its own page; current: nuki, preferences, notifications, passkeys, activity or
     account. -->
<nav th:fragment="settings(current)" class="sections" th:aria-label="#{nav.settings}">
    <ul>
        <li><a th:href="@{/settings/nuki}" th:attr="aria-current=${current == 'nuki'} ? 'page' : null"
               th:text="#{nav.nuki}">Nuki</a></li>
        <li><a th:href="@{/settings/preferences}" th:attr="aria-current=${current == 'preferences'} ? 'page' : null"
               th:text="#{nav.preferences}">Preferencias</a></li>
        <li><a th:href="@{/settings/notifications}" th:attr="aria-current=${current == 'notifications'} ? 'page' : null"
               th:text="#{nav.notifications}">Avisos</a></li>
        <li><a th:href="@{/settings/passkeys}" th:attr="aria-current=${current == 'passkeys'} ? 'page' : null"
               th:text="#{nav.passkeys}">Passkeys</a></li>
        <li><a th:href="@{/settings/activity}" th:attr="aria-current=${current == 'activity'} ? 'page' : null"
               th:text="#{nav.activity}">Actividad</a></li>
        <li><a th:href="@{/settings/account}" th:attr="aria-current=${current == 'account'} ? 'page' : null"
               th:text="#{nav.account}">Cuenta</a></li>
    </ul>
</nav>
<!-- A lock's pages, each a tab of the lock; current: links, history or settings. -->
<nav th:fragment="lock(lock, current)" class="sections" th:aria-label="${lock.name}">
    <ul>
        <li><a th:href="@{/locks/{id}/links(id=${lock.id})}" th:attr="aria-current=${current == 'links'} ? 'page' : null"
               th:text="#{locks.links}">Enlaces</a></li>
        <li><a th:href="@{/locks/{id}/history(id=${lock.id})}" th:attr="aria-current=${current == 'history'} ? 'page' : null"
               th:text="#{common.history}">Historial</a></li>
        <li><a th:href="@{/locks/{id}/settings(id=${lock.id})}" th:attr="aria-current=${current == 'settings'} ? 'page' : null"
               th:text="#{locks.details}">Estado y ajustes</a></li>
    </ul>
</nav>
</body>
</html>
