<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:if="${_csrf}" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:if="${_csrf}" th:content="${_csrf.headerName}">
    <title th:text="${title} + ' · welcome-home'">welcome-home</title>
    <link rel="stylesheet" th:href="@{/css/pico.min.css}">
</head>
<body>
<nav th:fragment="nav">
    <ul><li><a th:href="@{/}"><strong>welcome-home</strong></a></li></ul>
    <ul>
        <li><a th:href="@{/nuki/connection}">Nuki</a></li>
        <li th:if="${isAdmin}"><a th:href="@{/admin/owners}">Administración</a></li>
        <li>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="secondary">Salir</button>
            </form>
        </li>
    </ul>
</nav>
</body>
</html>
