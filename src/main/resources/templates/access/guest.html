<!DOCTYPE html>
<html lang="es" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${lockName})}"></head>
<body>
<main class="container">
    <article>
        <header><h1 th:text="${lockName}">Casa</h1></header>
        <p th:text="#{guest.validity(${#temporals.format(validFrom, #messages.msg('format.datetime'))}, ${#temporals.format(validUntil, #messages.msg('format.datetime'))}, ${timeZone})}">
            Este enlace abre la puerta del 1/11/2030 15:00 al 3/11/2030 11:00 (hora de Europe/Madrid).
        </p>

        <th:block th:if="${canOpen}">
            <button type="button" id="open" th:data-busy-text="#{guest.opening}" th:text="#{guest.open}">Abrir</button>
            <p id="open-result" role="status" hidden></p>
            <p><small th:text="#{guest.hint}">Pulsa cuando estés delante de la puerta.</small></p>
            <!-- What open.js shows after pressing the button, by outcome. -->
            <div id="open-messages" hidden>
                <span th:each="outcome : ${outcomes}" th:data-outcome="${outcome}"
                      th:text="${#messages.msg('guest.result.' + outcome)}">Puerta abierta: empújala.</span>
            </div>
        </th:block>

        <p th:if="${status.name() == 'PENDING'}" role="alert"
           th:text="#{guest.pending(${#temporals.format(validFrom, #messages.msg('format.datetime'))})}">
            Este enlace todavía no es válido.
        </p>
        <p th:if="${status.name() == 'EXPIRED'}" role="alert" th:text="#{guest.expired}">Este enlace ha caducado.</p>
        <p th:if="${status.name() == 'REVOKED'}" role="alert" th:text="#{guest.revoked}">Este enlace se ha revocado.</p>
        <p th:if="${unavailable}" role="alert" th:text="#{guest.unavailable}">Esta puerta no está disponible.</p>
    </article>
</main>
<script th:if="${canOpen}" th:src="@{/js/open.js}"></script>
</body>
</html>
