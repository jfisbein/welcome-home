# Master changelog: includes the changesets under changes/ in order. Runs as migrator, never as app_user.
# Rule: every new table with owner_id brings its ENABLE ROW LEVEL SECURITY and policy in the same changeset.
databaseChangeLog:
  - include:
      file: changes/001-current-owner-id.sql
      relativeToChangelogFile: true
  - include:
      file: changes/002-owner.sql
      relativeToChangelogFile: true
  - include:
      file: changes/003-invitation.sql
      relativeToChangelogFile: true
  - include:
      file: changes/004-webauthn.sql
      relativeToChangelogFile: true
  - include:
      file: changes/005-nuki-connection.sql
      relativeToChangelogFile: true
  - include:
      file: changes/006-lock.sql
      relativeToChangelogFile: true
  - include:
      file: changes/007-access-link.sql
      relativeToChangelogFile: true
  - include:
      file: changes/008-access-event.sql
      relativeToChangelogFile: true
