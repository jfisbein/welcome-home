notification.disconnected.subject=Nuki hat die Verbindung abgelehnt
notification.disconnected.body=Nuki hat die Verbindung abgelehnt, die welcome-home mit deinem Konto hatte: Deine \
  Links können die Tür erst wieder öffnen, wenn du Nuki neu verbindest.\n\n\
  Nuki neu verbinden: {0}
notification.reconnected.subject=Nuki akzeptiert die Verbindung wieder
notification.reconnected.body=Nuki akzeptiert die Verbindung, die welcome-home mit deinem Konto hat, wieder: Deine \
  Links können die Tür öffnen. Du musst nichts tun.
notification.lock-problems.subject={0}: Das Schloss braucht dich
notification.lock-problems.body=Das Schloss {0} hat ein Problem:\n\n{1}\n\nMehr Details: {2}\n\nWir melden uns erst \
  wieder, wenn es nach seiner Behebung erneut auftritt.
notification.lock-problem.OFFLINE=Nuki erreicht es nicht, daher können Links die Tür nicht öffnen.
notification.lock-problem.BATTERY_CRITICAL=Die Batterie ist kritisch: Tausch oder lade sie so bald wie möglich.
notification.lock-problem.MOTOR_BLOCKED=Der Motor ist blockiert: Prüf das Schloss.

account.recovery-created.subject=Ein Link zur Wiederherstellung deines welcome-home-Kontos wurde erstellt
account.recovery-created.body=Ein Admin hat einen Link erstellt, mit dem deinem welcome-home-Konto ein Passkey \
  hinzugefügt werden kann: Damit kommt wieder hinein, wer seine Passkeys verloren hat. Er läuft ab, sobald er \
  benutzt wurde, spätestens nach {0} Stunden.\n\n\
  Wer diesen Link öffnet, kann sich bei deinem Konto anmelden. Wenn du ihn nicht angefordert hast, sag einem \
  Admin Bescheid.
account.passkey-added.subject=Deinem welcome-home-Konto wurde ein Passkey hinzugefügt
account.passkey-added.body=Der Passkey „{0}“ wurde deinem welcome-home-Konto hinzugefügt, auf der Passkey-Seite \
  oder mit einem Wiederherstellungslink.\n\n\
  Wenn du das nicht warst, lösch ihn unter {1} und sag einem Admin Bescheid.
account.link.CREATED.subject={0}: Link „{1}“ erstellt
account.link.CREATED.body=Der Link „{1}“ für {0} wurde erstellt, gültig vom {2} bis zum {3} ({4}).
account.link.EDITED.subject={0}: Link „{1}“ bearbeitet
account.link.EDITED.body=Der Link „{1}“ für {0} wurde bearbeitet: Er ist jetzt vom {2} bis zum {3} gültig ({4}).
account.link.NEW_URL.subject={0}: neue URL für den Link „{1}“
account.link.NEW_URL.body=Der Link „{1}“ für {0} hat eine neue URL, und die bisherige öffnet die Tür nicht mehr. Er \
  ist vom {2} bis zum {3} gültig ({4}).
account.link.not-you=Wenn du das nicht warst, sperr ihn unter {0} und sieh dir die Aktivität deines Kontos unter {1} \
  an: Vielleicht hat sich jemand Zugang verschafft.
account.email-changed.subject=Die E-Mail-Adresse deines welcome-home-Kontos wurde geändert
account.email-changed.body=Die E-Mail-Adresse deines welcome-home-Kontos wurde von dieser Adresse in {0} geändert, \
  wohin die Benachrichtigungen gehen, sobald sie bestätigt ist. Wenn du das nicht warst, sag es der Person, die \
  welcome-home betreibt.
account.footer=welcome-home. Diese Benachrichtigung wird immer geschickt: Es geht um die Sicherheit deines Kontos.
account.verify.subject=Bestätige deine E-Mail-Adresse bei welcome-home
account.verify.body=Um die Benachrichtigungen von welcome-home an dieser Adresse zu bekommen, bestätige, dass sie \
  dir gehört:\n\n{0}\n\n\
  Der Link läuft in {1} Tagen ab. Wenn du dich nicht bei welcome-home registriert hast, ignoriere diese E-Mail.

notification.footer=welcome-home. Wähl aus, welche Benachrichtigungen du bekommst: {0}
