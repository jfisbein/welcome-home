notification.failed.body={1} hat {2} versucht, die Tür von {0} zu öffnen, aber es hat nicht geklappt: {3}.
notification.denied.subject={0}: Versuch mit dem Link für {1} abgelehnt
notification.denied.body=Jemand hat {2} versucht, die Tür von {0} mit dem Link für {1} zu öffnen, und wurde \
  abgelehnt: {3}.\n\n\
  Wenn du diesen Versuch nicht erwartet hast, ist der Link vielleicht in falsche Hände geraten: Erzeuge ihn neu \
  oder widerrufe ihn. \
  Eine Zeit lang benachrichtigen wir dich nicht über weitere abgelehnte Versuche mit diesem Link.
notification.reason.unavailable=das Schloss ist nicht verfügbar, weil es inaktiv ist oder Nuki getrennt ist
notification.reason.nuki-error=Nuki hat nicht geantwortet
notification.reason.lock-failed=das Schloss konnte nicht öffnen (zum Beispiel, weil der Motor blockiert ist)
notification.reason.night-mode=das Schloss ist im Nachtmodus
notification.reason.missing-permission=das gespeicherte Nuki API-Token darf nicht öffnen. Generiere eines mit der \
  Berechtigung „Geräte bedienen“ und füg es in welcome-home ein
notification.reason.invalid=der Link ist nicht gültig
notification.reason.not-yet-valid=der Link ist noch nicht gültig
notification.reason.expired=der Link ist abgelaufen
