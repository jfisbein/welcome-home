nuki.heading=Verbindung mit Nuki
nuki.connected-locks=Nuki verbunden. Deine Schlösser sind da: <strong>{0}</strong>. <a href="{1}">Zu deinen Schlössern</a>.
nuki.connected-no-locks=Nuki verbunden, aber wir haben in deinem Konto kein Schloss gefunden: Aktiviere deine \
  Schlösser für Nuki Web, wie unten erklärt.
nuki.disconnected=Nuki getrennt: Wir haben dein API-Token gelöscht. Wenn du es nicht mehr benutzen willst, lösch \
  es auch in Nuki Web.
nuki.disconnected.authorization=Nuki getrennt: Wir haben die Tokens gelöscht, mit denen welcome-home auf dein \
  Nuki-Konto zugegriffen hat.
nuki.not-connected=Du hast dein Nuki-Konto noch nicht verbunden.
nuki.ok.api-token=Mit einem API-Token verbunden.
nuki.ok.authorization=Mit deinem Nuki-Konto verbunden.
nuki.last-checked=Zuletzt geprüft: {0}.
nuki.rejected=Nuki hat die Verbindung abgelehnt, und Links können die Tür nicht öffnen. Verbinde Nuki neu, damit \
  sie funktionieren.
nuki.authorization.text=Wir leiten dich zu Nuki weiter, damit du dich mit deinem Konto anmeldest und welcome-home \
  erlaubst, deine Schlösser zu sehen, sie zu öffnen und ihren Verlauf zu lesen. Dein Nuki-Passwort geht nicht \
  über welcome-home.
nuki.authorization.switch.text=Du kannst dich statt mit dem API-Token mit deinem Nuki-Konto verbinden: \
  welcome-home erneuert seinen Zugriff selbst, und du musst keine Tokens mehr erzeugen oder einfügen.
nuki.authorization.connect=Mit Nuki verbinden
nuki.authorization.reconnect=Erneut mit Nuki verbinden
nuki.authorization.switch=Dein Nuki-Konto verwenden
nuki.authorization.cancelled=Du hast die Autorisierung bei Nuki abgebrochen: Wir haben nichts geändert.
nuki.authorization.failed=Die Verbindung mit Nuki konnte nicht abgeschlossen werden. Versuch es noch einmal.
nuki.authorization.missing-permission=Nuki hat welcome-home nicht alle Berechtigungen gegeben, die es braucht. \
  Verbinde dich erneut und akzeptiere alle.
nuki.web=Gerade ein Nuki-Gerät installiert?
nuki.web.text=Wir sehen nur die Geräte, die du für Nuki Web aktiviert hast, den Dienst von Nuki, um sie im Browser zu \
  verwalten. Du aktivierst sie in der Nuki App:
nuki.web.online=Bring das Gerät online, was Nuki Fernzugriff nennt: je nach Modell mit dem integrierten WLAN-Modul des \
  Smart Locks, mit Thread oder mit einer Nuki Bridge; einen Opener mit einer Nuki Bridge. <a \
  href="https://help.nuki.io/hc/de/articles/4402921104145" target="_blank" rel="noopener noreferrer">Die Möglichkeiten \
  deines Modells</a>.
nuki.web.activate=Tippe in der Nuki App auf das Gerät, öffne seine Einstellungen und geh zu <strong>Funktionen &amp; \
  Konfiguration</strong>, dann im Bereich Integrationen zu <strong>Nuki Web</strong>. Die App hilft dir, ein \
  Nuki-Web-Konto anzulegen oder dein vorhandenes zu verwenden. <a \
  href="https://help.nuki.io/hc/de/articles/360016485718" target="_blank" rel="noopener noreferrer">Nuki-Hilfe</a>.
nuki.web.each=Wiederhole den vorigen Schritt für jedes Gerät, auch für den Opener an der Haustür: Nuki Web zeigt nur \
  die Geräte, die einzeln aktiviert wurden.
nuki.web.connect=Verbinde Nuki hier mit demselben Nuki-Web-Konto. Ist es schon verbunden, klick unter <a \
  href="{0}">Schlösser</a> auf <strong>Von Nuki aktualisieren</strong>, um die neuen zu importieren.
nuki.token.instead=Stattdessen ein API-Token verwenden
nuki.how=So bekommst du das API-Token
nuki.how.sign-in=Melde dich bei <a href="https://web.nuki.io" target="_blank" rel="noopener noreferrer">Nuki \
  Web</a> mit deinem Nuki-Konto an.
nuki.how.api=Öffne im Menü links <strong>API</strong>. Wenn es das erste Mal ist, klick auf <strong>Nuki Web API \
  aktivieren</strong>.
nuki.how.generate=Klick unter <strong>API Token</strong> auf <strong>API Token generieren</strong> und nenn es \
  „welcome-home“.
nuki.how.permissions=Alle Kästchen sind angehakt: Lass nur diese drei angehakt, die welcome-home benutzt, und \
  entferne die übrigen Häkchen.
nuki.how.permission.view=<strong>Geräte anzeigen</strong>
nuki.how.permission.operate=<strong>Geräte bedienen</strong>, um die Tür zu öffnen
nuki.how.permission.log=<strong>Protokoll ansehen und Benachrichtigungen erhalten</strong>
nuki.how.save=Klick auf <strong>Speichern</strong>, kopier das Token und füg es hier unten ein.
nuki.token.stored=Es wird verschlüsselt gespeichert und nie wieder angezeigt.
nuki.token=API-Token
nuki.token.rejected=Nuki hat dieses API-Token nicht akzeptiert. Prüf, ob es vollständig ist.
nuki.token.missing-permission=Diesem API-Token fehlt eine der drei Berechtigungen oben. Generiere ein neues mit \
  allen dreien.
nuki.token.unavailable=Nuki antwortet gerade nicht. Versuch es in ein paar Minuten noch einmal.
nuki.connect=Verbinden
nuki.change=API-Token ändern
nuki.disconnect=Trennen
nuki.disconnect.text=Löscht die Verbindung mit Nuki aus welcome-home. Deine Schlösser und Links bleiben erhalten, \
  aber die Links können die Tür erst wieder öffnen, wenn du Nuki neu verbindest.
nuki.disconnect.button=Nuki trennen

