notification.opened.subject={0}: {1} hat die Tür geöffnet
notification.opened.body={1} hat die Tür von {0} {2} geöffnet.
notification.not-confirmed.subject={0}: Das Schloss hat nicht bestätigt, dass {1} die Tür geöffnet hat
