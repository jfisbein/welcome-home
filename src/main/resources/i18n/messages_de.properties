# User-facing texts in German. Every message goes through MessageFormat: {0} is its first argument, and an
# apostrophe is written ''. Same keys as messages.properties, whose comments say what each argument is.
# Owners and guests are addressed with du, and locks are zugesperrt and aufgesperrt, as in Nuki's own German.
# The steps to get an API token quote Nuki Web's German labels, as its translations had them on 2026-10-26.

