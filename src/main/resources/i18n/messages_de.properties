notification.disconnected.subject=Nuki hat die Verbindung abgelehnt
notification.disconnected.body=Nuki hat die Verbindung abgelehnt, die welcome-home mit deinem Konto hatte: Deine \
  Links können die Tür erst wieder öffnen, wenn du Nuki neu verbindest.\n\n\
  Nuki neu verbinden: {0}

account.recovery-created.subject=Ein Link zur Wiederherstellung deines welcome-home-Kontos wurde erstellt
account.recovery-created.body=Ein Admin hat einen Link erstellt, mit dem deinem welcome-home-Konto ein Passkey \
  hinzugefügt werden kann: Damit kommt wieder hinein, wer seine Passkeys verloren hat. Er läuft ab, sobald er \
  benutzt wurde, spätestens nach {0} Stunden.\n\n\
  Wer diesen Link öffnet, kann sich bei deinem Konto anmelden. Wenn du ihn nicht angefordert hast, sag einem \
  Admin Bescheid.
account.passkey-added.subject=Deinem welcome-home-Konto wurde ein Passkey hinzugefügt
account.passkey-added.body=Der Passkey „{0}“ wurde deinem welcome-home-Konto hinzugefügt, auf der Passkey-Seite \
  oder mit einem Wiederherstellungslink.\n\n\
  Wenn du das nicht warst, lösch ihn unter {1} und sag einem Admin Bescheid.
account.footer=welcome-home. Diese Benachrichtigung wird immer geschickt: Es geht um die Sicherheit deines Kontos.
account.verify.subject=Bestätige deine E-Mail-Adresse bei welcome-home
account.verify.body=Um die Benachrichtigungen von welcome-home an dieser Adresse zu bekommen, bestätige, dass sie \
  dir gehört:\n\n{0}\n\n\
  Der Link läuft in {1} Tagen ab. Wenn du dich nicht bei welcome-home registriert hast, ignoriere diese E-Mail.

notification.footer=welcome-home. Wähl aus, welche Benachrichtigungen du bekommst: {0}
