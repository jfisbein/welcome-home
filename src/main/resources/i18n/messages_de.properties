notification.when=am {0} um {1} Uhr ({2})
notification.opened.subject={0}: {1} hat die Tür geöffnet
notification.opened.body={1} hat die Tür von {0} {2} geöffnet.
notification.not-confirmed.subject={0}: Das Schloss hat nicht bestätigt, dass {1} die Tür geöffnet hat
notification.not-confirmed.body={1} wollte die Tür von {0} {2} öffnen, aber das Schloss hat nicht bestätigt, dass \
  sie aufgegangen ist: Vielleicht ist sie offen, vielleicht nicht.
notification.failed.subject={0}: {1} konnte die Tür nicht öffnen
notification.failed.body={1} hat {2} versucht, die Tür von {0} zu öffnen, aber es hat nicht geklappt: {3}.
notification.denied.subject={0}: Versuch mit dem Link für {1} abgelehnt
notification.denied.body=Jemand hat {2} versucht, die Tür von {0} mit dem Link für {1} zu öffnen, und wurde \
  abgelehnt: {3}.\n\n\
  Wenn du diesen Versuch nicht erwartet hast, ist der Link vielleicht in falsche Hände geraten: Ändere oder \
  sperre ihn. \
  Eine Zeit lang benachrichtigen wir dich nicht über weitere abgelehnte Versuche mit diesem Link.
notification.reason.unavailable=das Schloss ist nicht verfügbar, weil es inaktiv ist oder Nuki getrennt ist
notification.reason.nuki-error=Nuki hat nicht geantwortet
notification.reason.lock-failed=das Schloss konnte nicht öffnen (zum Beispiel, weil der Motor blockiert ist)
notification.reason.night-mode=das Schloss ist im Nachtmodus
notification.reason.missing-permission=die Verbindung mit Nuki darf nicht öffnen. Verbinde Nuki in welcome-home \
  neu, mit der Berechtigung „Geräte bedienen“
notification.reason.invalid=der Link ist nicht gültig
notification.reason.not-yet-valid=der Link ist noch nicht gültig
notification.reason.expired=der Link ist abgelaufen
notification.reason.outside-schedule=der Link öffnet zu dieser Zeit nicht, laut seinen Zeiten
notification.reason.revoked=der Link ist gesperrt
notification.reason.too-many-attempts=zu viele Versuche hintereinander
