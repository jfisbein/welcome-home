# User-facing texts in Spanish, the default language. Every message goes through MessageFormat: {0} is its
# first argument, and an apostrophe is written ''.

# What each outcome of a guest's attempt means to the owner, in the history (see audit.AccessOutcome).
outcome.opened=Abierta
outcome.not-confirmed=Sin confirmar: puede que se abriera
outcome.invalid=Denegado: enlace no válido
outcome.too-many-attempts=Denegado: demasiados intentos
outcome.revoked=Denegado: enlace revocado
outcome.not-yet-valid=Denegado: todavía no válido
outcome.expired=Denegado: caducado
outcome.unavailable=Denegado: puerta no disponible
outcome.nuki-error=Error: Nuki no responde
outcome.lock-failed=Error: la cerradura no pudo abrir
outcome.night-mode=Error: modo nocturno
outcome.missing-permission=Error: el API token no tiene permiso para abrir

# Emails about guests' attempts: {0} is the lock, {1} the link's label, {2} when (notification.when) and {3} why
# (notification.reason.*).
notification.when=el {0} a las {1} (hora de {2})
notification.opened.subject={0}: {1} ha abierto la puerta
notification.opened.body={1} ha abierto la puerta de {0} {2}.
notification.not-confirmed.subject={0}: la cerradura no ha confirmado que {1} abriera la puerta
notification.not-confirmed.body={1} ha pedido abrir la puerta de {0} {2}, pero la cerradura no ha confirmado \
  que se abriera: puede que se abriera o que no.
notification.failed.subject={0}: {1} no ha podido abrir la puerta
notification.failed.body={1} ha intentado abrir la puerta de {0} {2}, pero no ha podido: {3}.
notification.denied.subject={0}: intento denegado con el enlace de {1}
notification.denied.body=Se ha intentado abrir la puerta de {0} con el enlace de {1} {2}, y se ha denegado: {3}.\n\n\
  Si no esperabas este intento, puede que el enlace se haya filtrado: regenéralo o revócalo. \
  Durante un rato no te avisaremos de más intentos denegados con este enlace.
notification.reason.unavailable=la cerradura no está disponible: está inactiva o Nuki está desconectado
notification.reason.nuki-error=Nuki no respondió
notification.reason.lock-failed=la cerradura no pudo abrir (por ejemplo, el motor está bloqueado)
notification.reason.night-mode=la cerradura está en modo nocturno
notification.reason.missing-permission=el API token de Nuki que guardaste no tiene permiso para abrir. Genera uno \
  con el permiso «Gestionar dispositivos» y pégalo en welcome-home
notification.reason.invalid=el enlace no es válido
notification.reason.not-yet-valid=el enlace todavía no es válido
notification.reason.expired=el enlace ha caducado
notification.reason.revoked=el enlace está revocado
notification.reason.too-many-attempts=demasiados intentos seguidos
# {0} is the link's history page.
notification.history=Historial de este enlace: {0}

# {0} is the Nuki connection page.
notification.disconnected.subject=Nuki ha rechazado tu API token
notification.disconnected.body=Nuki ha rechazado el API token que guardaste en welcome-home: tus enlaces no \
  pueden abrir la puerta hasta que pegues uno nuevo.\n\n\
  Conecta Nuki de nuevo: {0}

# Emails about the owner's account, sent whatever their preferences: they are about its security.
# {0} is how many hours a recovery link lasts.
account.recovery-created.subject=Se ha creado un enlace para recuperar tu cuenta de welcome-home
account.recovery-created.body=Un administrador ha creado un enlace para añadir una passkey a tu cuenta de \
  welcome-home: sirve para volver a entrar a quien ha perdido sus passkeys, y caduca cuando se usa o a las {0} \
  horas.\n\n\
  Quien abra ese enlace podrá entrar en tu cuenta. Si no lo has pedido tú, avisa a un administrador.
# {0} is the passkey's name and {1} the passkeys page.
account.passkey-added.subject=Se ha añadido una passkey a tu cuenta de welcome-home
account.passkey-added.body=Se ha añadido la passkey «{0}» a tu cuenta de welcome-home, desde la página de \
  passkeys o con un enlace de recuperación.\n\n\
  Si no has sido tú, bórrala en {1} y avisa a un administrador.
account.footer=welcome-home. Este aviso se envía siempre: es sobre la seguridad de tu cuenta.

# The end of every email to owners: {0} is the notifications page.
notification.footer=welcome-home. Elige qué avisos recibes: {0}
