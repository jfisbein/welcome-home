# User-facing texts in French. Every message goes through MessageFormat: {0} is its first argument, and an
# apostrophe is written ''. Same keys as messages.properties, whose comments say what each argument is.
# A no-break space (U+00A0) goes before : ; ? ! % and inside « », as French typography wants. The steps to get
# an API token quote Nuki Web's French labels, as its translations had them on 2026-10-26.

