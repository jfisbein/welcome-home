nuki.web.online=Metti il dispositivo online, ciò che Nuki chiama accesso remoto: a seconda del modello, con il Wi-Fi \
  integrato dello Smart Lock, con Thread o con un Nuki Bridge; un Opener, con un Nuki Bridge. <a \
  href="https://help.nuki.io/hc/it/articles/4402921104145" target="_blank" rel="noopener noreferrer">Le opzioni del \
  tuo modello</a>.
nuki.web.activate=Nell''app Nuki, tocca il dispositivo, apri le sue impostazioni e vai su <strong>Funzioni e \
  configurazione</strong>, poi su <strong>Nuki Web</strong>. L''app ti guida nella creazione del tuo account Nuki Web, \
  o nell''uso di quello che hai già. <a href="https://help.nuki.io/hc/it/articles/360016485718" target="_blank" \
  rel="noopener noreferrer">Aiuto di Nuki</a>.
