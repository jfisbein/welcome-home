spring:
  application:
    name: welcome-home
  mvc:
    hiddenmethod:
      filter:
        # HTML forms send PUT and DELETE as POST with a hidden _method field.
        enabled: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  # Requests, emails (@Async) and jobs run on virtual threads: an opening waits up to 15 s for the lock's log, and
  # Nuki's backoff sleeps, without holding a platform thread.
  threads:
    virtual:
      enabled: true
  # User-facing texts. A language with no bundle of its own gets the default one, Spanish, never the server's
  # language; every message goes through MessageFormat, so an apostrophe is always written ''.
  messages:
    basename: i18n/messages
    fallback-to-system-locale: false
    always-use-message-format: true
  # The SMTP server for owners' emails: spring.mail.host, port, username and password come from the
  # environment. Without a host no email is sent.
  mail:
    properties:
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

management:
  health:
    mail:
      # Emails are optional and dropped when they fail: an SMTP server that cannot be reached must not make the
      # app unhealthy, as the stack's tunnel starts only once the app is healthy.
      enabled: false

server:
  # Behind Cloudflare Tunnel: X-Forwarded-Proto tells the app that the request came over HTTPS, which HSTS,
  # secure cookies and https URLs rely on. Trustworthy because the tunnel is the only way in.
  forward-headers-strategy: framework
  servlet:
    session:
      # The session cookie: only over HTTPS, not readable from JavaScript, not sent on cross-site subrequests.
      cookie:
        secure: true
        http-only: true
        same-site: lax

welcomehome:
  # Public URL of the app, used to build invitation and access links.
  base-url: ${BASE_URL:}
  crypto:
    aead-keyset-file: ${AEAD_KEYSET_FILE:}
    mac-keyset-file: ${MAC_KEYSET_FILE:}
  nuki:
    # Daily check of every owner's Nuki connection, in the server's time zone.
    check-cron: "0 0 8 * * *"
  access:
    # Attempts to open a door allowed per period, per guest IP address and per link.
    rate-limit:
      per-ip: 10
      per-link: 5
      period: PT1M
    # After Nuki accepts an unlatch, how long to wait for the lock's log to confirm it, and how often to look.
    confirmation:
      timeout: PT15S
      interval: PT2S
    # Where the guest's IP address comes from: Cloudflare sets this header on every request. Blank to use the
    # address the request came from, if the app is ever reachable other than through the tunnel.
    client-ip-header: CF-Connecting-IP
    # Where the guest's country comes from, for the history: Cloudflare sets this header when its IP Geolocation is
    # on. Blank to record none.
    client-country-header: CF-IPCountry
  notifications:
    # The sender of owners' emails, an address the SMTP service accepts, such as
    # "welcome-home <avisos@example.com>". Without it no email is sent.
    from: ${NOTIFICATIONS_FROM:}
    # After an email about a refused attempt with a link, none about that link for this long.
    denied-quiet-period: PT1H
  audit:
    # Guests' attempts are kept this long (they hold IP addresses), and purged daily, in the server's time zone.
    retention: P365D
    purge-cron: "0 30 3 * * *"
  admin:
    # Invitations and passkey recovery links are deleted 30 days after they expire, daily, in the server's time
    # zone, before the 04:00 backup.
    purge-cron: "0 35 3 * * *"
